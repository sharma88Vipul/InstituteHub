name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test tests/InstituteHub.UnitTests --no-build --configuration Release

      # Uses Testcontainers: Docker is available on ubuntu-latest runners.
      - name: Integration tests
        run: dotnet test tests/InstituteHub.IntegrationTests --no-build --configuration Release
