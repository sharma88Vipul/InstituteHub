name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test tests/InstituteHub.UnitTests --no-build --configuration Release

      # Uses Testcontainers: Docker is available on ubuntu-latest runners.
      - name: Integration tests
        run: dotnet test tests/InstituteHub.IntegrationTests --no-build --configuration Release

  # On main: build the Docker image (app + migration bundle) and push it to GitHub Container Registry.
  # The server then runs: docker compose -f docker-compose.prod.yml pull && docker compose ... up -d
  docker-image:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/institutehub:latest
            ghcr.io/${{ github.repository_owner }}/institutehub:${{ github.sha }}
