# Production on one Linux server (design doc 10): app + PostgreSQL + Caddy (automatic HTTPS) + Seq (logs).
#   cd deploy && cp .env.example .env   (fill it in)
#   docker compose -f docker-compose.prod.yml up -d
# See deploy/README.md for the full checklist.

name: institutehub

services:
  app:
    image: ${APP_IMAGE:-institutehub:latest}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Caddy terminates HTTPS; trust its X-Forwarded-* headers so redirects and secure cookies work.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=institutehub;Username=institutehub;Password=${POSTGRES_PASSWORD}"
      App__PublicBaseUrl: "https://${APP_DOMAIN}"
      TZ: Asia/Kolkata
    volumes:
      - appdata:/app/data
      - appkeys:/app/keys
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: institutehub
      POSTGRES_USER: institutehub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Only reachable from this server (for backups / psql over SSH), never from the internet.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U institutehub -d institutehub"]
      interval: 10s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  seq:
    image: datalust/seq:2025.2
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD}
    # Open the log UI through an SSH tunnel: ssh -L 5341:localhost:5341 you@server
    ports:
      - "127.0.0.1:5341:80"
    volumes:
      - seqdata:/data

volumes:
  pgdata:
  appdata:
  appkeys:
  caddy_data:
  caddy_config:
  seqdata:
